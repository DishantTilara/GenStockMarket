version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: genstock_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-stockmarket}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockmarket"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: genstock_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genstock_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/stockmarket
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/stockmarket
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - MARKET_DATA_PROVIDER=simulated
      - LLM_PROVIDER=openai
      - BROKER_PROVIDER=paper
    ports:
      - "8000:8000"
    command: >
      sh -c "alembic upgrade head &&
             python -m app.main"

  market_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genstock_market_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/stockmarket
      - SYNC_DATABASE_URL=postgresql://postgres:postgres@postgres:5432/stockmarket
      - REDIS_URL=redis://redis:6379/0
    command: python -m app.workers.market_ingestion_worker

  reconciliation_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: genstock_reconciliation_worker
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/stockmarket
      - REDIS_URL=redis://redis:6379/0
    command: python -m app.workers.reconciliation_worker

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: genstock_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
